<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Daily Image</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 16px;
    }
  </style>
</head>
<body>

<img id="img">

<script>
  const images = [
    "E84FE067-528D-49B7-AEC9-0EED361D6498.jpg",
    "IMG_1778.PNG"
  ];

  const random = Math.floor(Math.random() * images.length);
  document.getElementById("img").src = images[random];
</script>

</body>
</html>
